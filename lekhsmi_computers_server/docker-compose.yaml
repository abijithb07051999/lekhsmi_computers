services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lekhsmi_computers
      POSTGRES_PASSWORD: "BozSK5TQssp7GDz8v-IXSlgtl6ekg_lu"
    volumes:
      - lekhsmi_computers_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "UdYEZgSmp41u_3OYlmwWGihFXLWhxf5K"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lekhsmi_computers_test
      POSTGRES_PASSWORD: "yfjMxga0oNLAI9gYTxvMOecTHaqESrLT"
    volumes:
      - lekhsmi_computers_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "g_MkLP47cjoHx72JSgRhmPIevtQv6_Ez"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  lekhsmi_computers_data:
  lekhsmi_computers_test_data:
